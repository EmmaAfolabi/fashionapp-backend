version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fashionapp-db
    environment:
      POSTGRES_DB: fashiondb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD:
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  fashionapp:
    build: .
    container_name: fashionapp-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fashiondb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD:
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    command: ["java", "-jar", "app.jar"]

volumes:
  postgres_data:
    driver: local

